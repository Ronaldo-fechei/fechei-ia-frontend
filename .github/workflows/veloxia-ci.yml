name: Gatilho CI

on:
  push:
    paths:
      - "veloxia/**"
      - ".github/workflows/veloxia-ci.yml"
  pull_request:
    paths:
      - "veloxia/**"
      - ".github/workflows/veloxia-ci.yml"

concurrency:
  group: veloxia-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: veloxia

jobs:
  test:
    name: Typecheck, testes e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veloxia
          POSTGRES_PASSWORD: veloxia
          POSTGRES_DB: veloxia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloxia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://veloxia:veloxia@localhost:5432/veloxia_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: veloxia/.nvmrc
          cache: npm
          cache-dependency-path: veloxia/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Subir o app para os testes e2e
        env:
          PGPASSWORD: veloxia
          PORT: "3333"
          APP_URL: http://localhost:3333
          DATABASE_URL: postgres://veloxia:veloxia@localhost:5432/veloxia_e2e
          LOG_LEVEL: info
        run: |
          psql -h localhost -U veloxia -d veloxia_test -c "CREATE DATABASE veloxia_e2e"
          nohup node server/dist/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3333/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - name: Testes e2e
        run: npm run e2e --workspace web
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3333
      - name: Diagnóstico dos testes e2e
        if: failure()
        run: |
          find web/test-results -name error-context.md -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true
          echo "=== server.log"; tail -n 200 server.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: veloxia/web/playwright-report
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t veloxia:ci .
