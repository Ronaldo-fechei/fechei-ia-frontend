# Blueprint do Render — https://render.com/docs/blueprint-spec
# Como este app fica na pasta veloxia/ do repositório, ao criar o Blueprint no painel
# do Render informe o caminho do arquivo: veloxia/render.yaml
#
# Cria: 1 serviço web (API + painel + worker da fila no mesmo processo) e 1 PostgreSQL.
# Use um plano pago (não "free"): instâncias gratuitas hibernam, o que atrasa webhooks
# da Meta e pausa os envios agendados (blocos "Aguardar").
services:
  - type: web
    name: veloxia
    runtime: docker
    region: ohio
    plan: starter
    dockerContext: ./veloxia
    dockerfilePath: ./veloxia/Dockerfile
    buildFilter:
      paths:
        - veloxia/**
    healthCheckPath: /health
    # Vincula o Environment Group "veloxia" (criado no painel do Render) a este serviço.
    # Sem esta linha o grupo NÃO é aplicado automaticamente: variáveis definidas só nele
    # (ex.: MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET) podem nunca chegar ao container, ou um
    # valor antigo deixado como var individual do serviço pode sombrear o do grupo.
    envVarGroups:
      - veloxia
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: veloxia-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      # Chave dos tokens criptografados, gerada pelo Render. Nunca troque: trocar invalida as conexões.
      - key: ENCRYPTION_KEY
        generateValue: true
      # APP_URL não é necessária no Render: o endereço público vem de RENDER_EXTERNAL_URL.
      # Ao ligar um domínio próprio, adicione APP_URL=https://app.seudominio.com.br no painel.
      # Valores pedidos na criação do Blueprint (todos podem ficar em branco agora):
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_ID # WhatsApp (cadastro incorporado)
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_CONFIG_ID
        sync: false
      # MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET vêm do Environment Group "veloxia" (acima) —
      # não declarar aqui também, para não correr o risco de um valor desatualizado
      # salvo diretamente no serviço sombrear o valor atual do grupo.
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY # opcional (recursos de IA)
        sync: false

databases:
  - name: veloxia-db
    databaseName: veloxia
    region: ohio
    user: veloxia
    plan: basic-256mb
    postgresMajorVersion: "16"
