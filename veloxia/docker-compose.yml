# Desenvolvimento local: PostgreSQL. Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veloxia
      POSTGRES_PASSWORD: veloxia
      POSTGRES_DB: veloxia
    ports:
      - "5432:5432"
    volumes:
      - veloxia-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloxia"]
      interval: 5s
      retries: 10
volumes:
  veloxia-pg:
