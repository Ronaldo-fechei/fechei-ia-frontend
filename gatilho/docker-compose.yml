# Desenvolvimento local: PostgreSQL. Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatilho
      POSTGRES_PASSWORD: gatilho
      POSTGRES_DB: gatilho
    ports:
      - "5432:5432"
    volumes:
      - gatilho-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatilho"]
      interval: 5s
      retries: 10
volumes:
  gatilho-pg:
